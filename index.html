<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squaredom</title>
<meta name="theme-color" content="#17142a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Squaredom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Tiny5&display=swap" rel="stylesheet">
<!-- ?v= is the release number: change it (all four together) with every update so browsers load the new files -->
<link rel="stylesheet" href="style.css?v=28">
</head><body>
<h1>Squaredom <small class="ver">v1.0</small></h1>
<div class="tabs"><button class="tab on" data-t="board">Board</button><button class="tab" data-t="ref">Compendium</button></div>
<section id="tab-board">
<div id="items"><div class="lbl">Items: drag onto a room while its owner is home</div></div>
<div id="wrap"><canvas id="cv" aria-label="Squaredom board"></canvas><div id="labels"></div><div id="bub"></div></div>
<div id="tray"><div class="lbl">Shelf: drag a box up to the board</div></div>
<div class="row"><button class="b" id="reset">Reset game</button></div>
</section>
<section id="tab-ref" hidden><div id="refs"></div></section>
<canvas id="ghost" width="96" height="96"></canvas>
<div id="toast" role="status"></div>
<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><p></p><div class="mrow"><button class="b" id="mYes">Buy</button><button class="b" id="mNo">Cancel</button></div></div></div>
<script src="data.js?v=28"></script>
<script src="art.js?v=28"></script>
<script src="game.js?v=28"></script>
</body></html>
